<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kick Night Mode</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <span>K</span>
        </div>
        <div>
          <p class="eyebrow">Appearance for Kick</p>
          <h1>Night Mode</h1>
        </div>
        <span class="scope-dot" title="Scoped to use.kick.co"></span>
      </header>

      <section class="appearance-card" aria-labelledby="appearance-title">
        <div class="section-heading">
          <div>
            <h2 id="appearance-title">Choose appearance</h2>
            <p>Updates every open Kick tab.</p>
          </div>
        </div>

        <fieldset class="mode-grid" data-appearance-form aria-busy="true">
          <legend class="visually-hidden">Appearance preference</legend>

          <label class="mode-option">
            <input type="radio" name="mode" value="system">
            <span class="mode-icon mode-icon-system" aria-hidden="true"></span>
            <span class="mode-label">System</span>
            <span class="mode-detail">Match computer</span>
          </label>

          <label class="mode-option">
            <input type="radio" name="mode" value="light">
            <span class="mode-icon mode-icon-light" aria-hidden="true"></span>
            <span class="mode-label">Light</span>
            <span class="mode-detail">Kick original</span>
          </label>

          <label class="mode-option">
            <input type="radio" name="mode" value="dark">
            <span class="mode-icon mode-icon-dark" aria-hidden="true"></span>
            <span class="mode-label">Dark</span>
            <span class="mode-detail">Low-light comfort</span>
          </label>
        </fieldset>

        <p class="status" data-status data-tone="neutral" role="status" aria-live="polite">
          Loading appearance…
        </p>
      </section>

      <footer>
        <div class="privacy-icon" aria-hidden="true"></div>
        <p>
          Private by design. No accounting data is read, stored, or sent.
        </p>
      </footer>
    </main>

    <script src="../src/theme-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
