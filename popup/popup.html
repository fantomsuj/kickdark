<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kick Appearance</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <span class="app-mark" aria-hidden="true">K</span>
        <div class="header-copy">
          <h1>Kick Appearance</h1>
          <p>Choose how Kick looks in every tab.</p>
        </div>
      </header>

      <section class="preference-pane" aria-label="Appearance settings">
        <fieldset class="mode-list" data-appearance-form aria-busy="true">
          <legend>Appearance</legend>

          <div class="preference-group">
            <label class="mode-option">
              <input type="radio" name="mode" value="system">
              <span class="mode-copy">
                <span class="mode-label">System</span>
                <span class="mode-detail">Match your Mac</span>
              </span>
              <span class="selection-mark" aria-hidden="true"></span>
            </label>

            <label class="mode-option">
              <input type="radio" name="mode" value="light">
              <span class="mode-copy">
                <span class="mode-label">Light</span>
                <span class="mode-detail">Always use light appearance</span>
              </span>
              <span class="selection-mark" aria-hidden="true"></span>
            </label>

            <label class="mode-option">
              <input type="radio" name="mode" value="dark">
              <span class="mode-copy">
                <span class="mode-label">Dark</span>
                <span class="mode-detail">Comfortable in low light</span>
              </span>
              <span class="selection-mark" aria-hidden="true"></span>
            </label>
          </div>
        </fieldset>

        <p class="status" data-status data-tone="neutral" role="status" aria-live="polite">
          Loading appearance…
        </p>
      </section>

      <footer>
        <span class="privacy-icon" aria-hidden="true"></span>
        <p>Your preference stays in Chrome. No accounting data is read.</p>
      </footer>
    </main>

    <script src="../src/theme-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
